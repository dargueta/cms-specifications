# SPDX-License-Identifier: BSD-3-Clause
$schema: https://datapackage.org/profiles/2.0/tableschema.json
fieldsMatch: [subset]
fields:
  - name: record_type
    title: Record Type
    type: string
    constraints:
      enum: ["DTL"]
      maxLength: 3
  - name: original_record_type
    title: Record Type
    type: string
    constraints:
      maxLength: 5
      required: true
  - name: beneficiary_id
    title: Beneficiary ID
    description: >-
      This field will contain exactly what is received in the same field of the
      beneficiary's Detail record in the related BEQ Request file.
    type: string
    constraints:
      minLength: 11
      maxLength: 12
      required: true
  - name: _filler
    type: string
    constraints:
      enum: [""]
      maxLength: 9
  - name: beneficiary_dob
    title: Beneficiary's Date of Birth
    type: date
    format: "%Y%m%d"
    constraints:
      maxLength: 8
  - name: sex_code
    title: Sex Code
    description: The sex of the beneficiary.
    type: string
    rdfType: https://schema.org/GenderType
    categories:
      - value: "0"
        label: Unknown
      - value: "1"
        label: Male
      - value: "2"
        label: Female
  - name: detail_record_sequence_number
    title: Detail Record Sequence Number
    type: integer
    constraints:
      minLength: 1
      maxLength: 7
      minimum: 0
      maximum: 9999999
      required: true
      unique: true
  - name: processed_flag
    title: Processed Flag
    type: boolean
    trueValues: ["Y"]
    falseValues: ["N"]
    constraints:
      required: true
  - name: beneficiary_matched_flag
    title: Beneficiary Matched Flag
    type: boolean
    trueValues: ["Y"]
    falseValues: ["N"]
    constraints:
      required: true
  - name: medicare_part_a_entitlement_start_date
    title: Medicare Part A Entitlement Start Date
    type: date
    format: "%Y%m%d"
    constraints:
      maxLength: 8
  - name: medicare_part_a_entitlement_end_date
    title: Medicare Part A Entitlement End Date
    type: date
    format: "%Y%m%d"
    constraints:
      maxLength: 8
  - name: medicare_part_b_entitlement_start_date
    title: Medicare Part B Entitlement Start Date
    type: date
    format: "%Y%m%d"
    constraints:
      maxLength: 8
  - name: medicare_part_b_entitlement_end_date
    title: Medicare Part B Entitlement End Date
    type: date
    format: "%Y%m%d"
    constraints:
      maxLength: 8
