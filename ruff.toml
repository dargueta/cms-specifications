target-version = "py311"

[lint]
exclude = ["docs/*"]
select = ["ALL"]
extend-ignore = [
    "ANN401",
    "COM812",
    "CPY001",  # Requires copyright notice in every file
    "D105",
    "D107",
    "DTZ",
    "EM",
    "ERA001",
    "FBT",
    "FIX002",  # Disallows FIXMEs
    "PLR2004",
    "TD003",
    "TRY003",
]

[lint.pyupgrade]
keep-runtime-typing = true

[lint.per-file-ignores]
"__init__.py" = ["F403", "PLC0414"]
"src/schemas/scripts/schemas.py" = ["I002", "N815", "TC003"]
"Makefile.py" = ["I002", "TC003"]

[lint.isort]
force-single-line = true
lines-after-imports = 2
order-by-type = false
required-imports = ["from __future__ import annotations"]

[lint.mccabe]
max-complexity = 9

[lint.flake8-annotations]
mypy-init-return = true

[lint.pydocstyle]
convention = "google"
