$schema: https://datapackage.org/profiles/2.0/tableschema.json
fieldsMatch: [subset]
fields:
  - !const
    __value: MMABEQRH
    name: file_id_name
    title: File ID Name
    description: >-
      Critical Field: This code identifies the file
      as a BEQ Request File and this record as
      the Header Record of the file.
  - name: sending_entity
    title: Sending Entity
    description: >-
      Critical Field: This field provides CMS
      with the identification of the entity that is
      sending the BEQ Request File. The value
      for this field is provided to CMS and used
      in connection with CMS electronic
      routing and mailbox functions. The value
      in this field should agree with the
      corresponding value in the Trailer Record.
    type: string
    rdfType: https://schema.org/Organization
    constraints:
      maxLength: 8
      minLength: 5
      required: true
  - !date8
    name: file_creation_date
    title: File Creation Date
    description: >-
      Critical Field: The date that the Sending
      Entity created the BEQ Request File. For
      example, January 3 2017 is the value
      20170103. This value should agree with
      the corresponding value in the Trailer
      Record. CMS returns this information to
      the Sending Entity on all Detail Records
      of a BEQ Response File.
    constraints:
      required: true
  - name: file_control_number
    title: File Control Number
    description: >-
      Critical Field

      The specific Control Number assigned by
      the Sending Entity to the BEQ Request
      File. CMS returns this information to the
      Sending Entity on all Detail Records of a
      BEQ Response File. This value should
      agree with the corresponding value in the
      Trailer Record.
    type: string
    constraints:
      maxLength: 9
      minLength: 1
      required: true
  - !filler 717
