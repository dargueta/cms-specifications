# SPDX-License-Identifier: BSD-3-Clause
$schema: https://datapackage.org/profiles/2.0/tableschema.json
fieldsMatch: [subset]
fields:
  - !beneficiary-identifier
  - name: surname
    title: Surname
    type: string
    constraints:
      maxLength: 12
      required: true
  - name: first_name
    title: First Name
    type: string
    constraints:
      maxLength: 7
      required: true
  - name: middle_initial
    title: Middle Initial
    type: string
    constraints:
      maxLength: 1
  - !sex-code
    name: sex
    title: Sex
    constraints:
      required: true
  - !date8
    name: birth_date
    title: Birth Date
    constraints:
      required: true
  - !filler 1
  - name: pbp_number
    title: "PBP #"
    description: Not required but must be valid for the contract when provided.
    type: string
    constraints:
      maxLength: 3
  - !plan-election-type
    name: election_type
    title: Election Type
    description: >-
      Required for all Plan types except HCPP, COST 1 without drug, COST 2
      without drug, CCIP/FFS demo, MDHO demo, MSHO demo, and PACE National Plans.

      * MAs have A, D, I, L[^retronote], M, N, O, S, T, U, V, W, X.
      * MAPDs have A, D, E, I, L[^retronote], M, N, O, S, T, U, V, W, X, Z.
      * PDPs have A, E, L[^retronote], S, U, V, W, X, Z.

      [^retronote]: For RPC Retroactive transactions only effective 1/1/2025. Plan
      disenrollment transactions after 1/1/2025 will reject.
  - name: contract_number
    title: "Contract #"
    type: string
    constraints:
      maxLength: 5
      required: true
  - !filler 8
  - name: transaction_code
    type: string
    constraints:
      enum:
        - "51"
        - "54"
      required: true
    __metadata__:
      deserialization:
        is_record_type_id: true
  - !special-election-period-code
    name: disenrollment_reason_code
    title: Disenrollment Reason Code
    description: >-
      Required for Involuntary Disenrollments. Optional for Voluntary Disenrollments.
  - !date8
    name: effective_date
    title: Effective Date
    constraints:
      required: true
  - name: segment_id
    title: Segment ID
    type: string
    constraints:
      maxLength: 3
  - !filler 24
  - !bool-yn
    name: part_d_opt_out_flag
    title: Part D Opt-Out Flag
    description: >-
      Optional for all Part D Plans; otherwise blank.
  - !bool-yn
    name: mmp_opt_out_flag
    title: MMP Opt-Out Flag
  - !plan-election-type
    name: election_type
    title: Election Type
    constraints:
      maxLength: 2
  - !filler 107
  - name: plan_transaction_tracking_id
    title: Plan Transaction Tracking ID
    type: string
    constraints:
      maxLength: 15
  - !filler 76
