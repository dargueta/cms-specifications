name: CI

on: [ push ]

jobs:
  generation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python Dependencies
        run: pip3 install -Ur code/schemas/requirements.txt
      - name: Test generating files
        run: make -C code/schemas
